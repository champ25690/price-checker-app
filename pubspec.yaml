name: price_checker
description: Price Checker App for store staff
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  mobile_scanner: ^5.2.3
  cached_network_image: ^3.3.1
  go_router: ^13.2.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  supabase: ^2.13.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
